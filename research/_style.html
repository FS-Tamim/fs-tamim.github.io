<!-- Styling for the Research page. Change the colors in the first block. -->
<style>

  /* ---------- Colors ---------- */
  .rs {
    --ink:         #1f2933;   /* main text        */
    --muted:       #5f6b7a;   /* authors, notes   */
    --line:        #e6e9ee;   /* card borders     */
    --accent:      #2f5d8a;   /* headings, badges */
    --accent-soft: #eef3f9;   /* badge background */
    --me:          #1f7a4d;   /* your name        */

    color: var(--ink);
    font-size: 0.95rem;
  }

  /* ---------- Headings ---------- */
  .rs h2.rs-h {
    margin: 2.2rem 0 0.4rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid var(--line);
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--ink);
  }

  .rs h3.rs-sub {
    margin: 1.8rem 0 0.8rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ---------- Intro text ---------- */
  .rs .rs-lead {
    margin: 0 0 1rem;
    line-height: 1.75;
    color: var(--muted);
  }

  .rs .rs-note {
    margin: 0.3rem 0 0;
    font-size: 0.88rem;
    color: var(--muted);
  }

  .rs .rs-note a       { color: var(--accent); text-decoration: none; }
  .rs .rs-note a:hover { text-decoration: underline; }

  /* ---------- Research interest tags ---------- */
  .rs .rs-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .rs .rs-chips li {
    margin: 0;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.85rem;
  }

  /* ---------- Publication card ---------- */
  .rs .pub {
    display: flex;
    gap: 1rem;
    margin: 0 0 0.8rem;
    padding: 1rem 1.1rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .rs .pub:hover {
    border-color: #c9d4e2;
    box-shadow: 0 2px 10px rgba(31, 41, 51, 0.06);
  }

  .rs .pub-year {
    flex: 0 0 3.2rem;
    padding-top: 0.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
  }

  .rs .pub-body { flex: 1; min-width: 0; }

  .rs .pub-title {
    margin: 0 0 0.3rem;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.45;
    color: var(--ink);
  }

  .rs .pub-authors {
    margin: 0 0 0.55rem;
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--muted);
  }

  .rs .pub-authors .me { font-weight: 600; color: var(--me); }

  /* ---------- Badges and buttons ---------- */
  .rs .pub-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
  }

  .rs .venue,
  .rs .status,
  .rs .btn {
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    font-size: 0.78rem;
    text-decoration: none;
  }

  .rs .venue  { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .rs .status { background: #fff6e5; color: #9a5b00; font-weight: 600; }
  .rs .btn    { border: 1px solid var(--line); color: var(--ink); }
  .rs .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Phones ---------- */
  @media (max-width: 600px) {
    .rs .pub      { flex-direction: column; gap: 0.3rem; }
    .rs .pub-year { flex: none; }
  }

</style>
