{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png" sizes="16x16">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="theme-color" content="#2f5d8a">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<link rel="stylesheet" href="{{ base_path }}/assets/css/site-theme.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">

<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "dark" && t !== "light") {
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest(".theme-toggle") : null;
    if (!btn) { return; }
    ev.preventDefault();
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.classList.add("theme-animate");
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    setTimeout(function () { root.classList.remove("theme-animate"); }, 350);
  });
</script>
<link rel="stylesheet" href="{{ base_path }}/assets/css/dark-mode.css">

<link rel="stylesheet" href="{{ base_path }}/assets/css/photo-effect.css">

<!-- end custom head snippets -->
